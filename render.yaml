# Render.com deployment configuration
# Docs: https://render.com/docs/yaml-spec

services:
  - type: web
    name: batloung-farmflow-hub
    env: node
    region: frankfurt    # closest to Lesotho
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false       # paste Neon connection string from Neon console
      - key: JWT_SECRET
        sync: false       # generate: openssl rand -base64 32
      - key: FRONTEND_URL
        value: https://batloung-farmflow-hub.onrender.com
